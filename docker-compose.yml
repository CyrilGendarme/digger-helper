services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: digger-helper-backend:local
    container_name: digger-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Hot-reload: mount source (comment out for production-like testing)
      - ./backend:/app
    # Override CMD to enable hot-reload during development
    command: >
      uvicorn main:app
        --host 0.0.0.0
        --port 8000
        --reload
    restart: unless-stopped
